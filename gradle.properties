# ============================================================================
#  Ajustes do build.
#  Mantido deliberadamente MINIMO: cada opcao ligada aqui e mais uma peca que
#  pode quebrar. Cache de configuracao e execucao paralela foram removidos -
#  eles aceleram projetos grandes, e este tem um modulo so.
# ============================================================================

# Memoria do processo que compila.
# Foi reduzido de 2048m para 1536m de proposito: nesta maquina o build roda
# com pouca RAM livre, e um heap grande demais faz a JVM do Gradle morrer no
# arranque - o sintoma e o erro inutil "Could not receive a message from the
# daemon". Se sobrar memoria, da para subir de novo.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Compila o Kotlin DENTRO do processo do Gradle, em vez de subir um segundo
# processo Java so para isso. Fica um pouco mais lento em projetos grandes,
# mas economiza varias centenas de MB - o que importa mais aqui.
kotlin.compiler.execution.strategy=in-process

# AndroidX e obrigatorio para Compose.
android.useAndroidX=true
# Gera R.java so com os recursos do proprio modulo (build mais rapido).
android.nonTransitiveRClass=true

kotlin.code.style=official
